<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>VexaScript + Preact advanced sample</title>
        <style>
            :root { color: #24212f; background: #eeeaf8; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
            * { box-sizing: border-box; }
            body { margin: 0; padding: 32px 16px; }
            button, input, select { font: inherit; }
            button { cursor: pointer; border: 0; border-radius: 9px; padding: 10px 14px; color: white; background: #5b4bdb; }
            input, select { border: 1px solid #b8b1d0; border-radius: 8px; padding: 9px 10px; }
            .app { width: min(900px, 100%); margin: auto; padding: 28px; border-radius: 22px; box-shadow: 0 18px 70px #4f3e8124; transition: color .2s, background .2s; }
            .app.dark { color: #f5f1ff; }
            .eyebrow { margin: 0; color: #7565ee; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
            h1 { margin: 6px 0; font-size: clamp(30px, 6vw, 54px); line-height: 1; }
            .toolbar, .task-form, .filters, .summary, .lifecycle { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
            .toolbar { margin: 22px 0; }
            .task-form, .filters, .lifecycle { margin: 16px 0; padding: 16px; border: 1px solid #d5cee8; border-radius: 14px; }
            .field { display: grid; gap: 5px; min-width: 190px; flex: 1; }
            .field span, legend { font-size: 12px; font-weight: 750; }
            .check-field { display: flex; gap: 7px; align-items: center; padding-bottom: 10px; }
            .filters label { display: flex; gap: 5px; align-items: center; }
            .signal-counter { width: 100%; margin: 4px 0 16px; background: #157a6e; }
            .summary { justify-content: space-between; border-left: 4px solid; padding: 12px 14px; background: #7965d714; }
            .tasks { list-style: none; padding: 0; }
            .tasks li { margin: 8px 0; padding: 12px; border-radius: 10px; background: #7965d714; }
            .tasks label { display: flex; gap: 10px; align-items: center; }
            .tasks .done span { opacity: .55; text-decoration: line-through; }
            mark { margin-left: auto; border-radius: 999px; padding: 3px 8px; color: #842211; background: #ffd7c9; }
            .lifecycle { border-left: 4px solid; }
            .context-readout { font-family: ui-monospace, monospace; opacity: .72; }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script src="%VEXA_ENTRYPOINT%" type="module"></script>
    </body>
</html>
