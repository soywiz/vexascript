<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>VexaScript D3 sample</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; background: #f4f7fb; color: #172033; }
      main { width: min(900px, calc(100% - 2rem)); margin: 3rem auto; }
      .panel { padding: 1.5rem; border: 1px solid #d9e1ef; border-radius: 18px; background: white; box-shadow: 0 16px 50px #25385c18; }
      h1 { margin: 0 0 .35rem; font-size: clamp(1.65rem, 4vw, 2.35rem); }
      p { margin: 0 0 1.5rem; color: #536078; }
      svg { display: block; width: 100%; height: auto; overflow: visible; }
      .bars rect { fill: #5677f2; }
      .trend { fill: none; stroke: #ef8354; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
      .x-axis, .y-axis { color: #6b768c; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Monthly readings</h1>
        <p>Rendered from VexaScript with real D3 scales, axes, joins, and paths.</p>
        <svg id="chart"></svg>
      </section>
    </main>
    <script type="module" src="%VEXA_ENTRYPOINT%"></script>
  </body>
</html>
